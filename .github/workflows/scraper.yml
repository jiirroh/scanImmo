name: Veille Immobilière - Rapport Quotidien & Alertes

on:
  # Exécution programmée tous les matins à 07h00 UTC (08h00 ou 09h00 en France)
  schedule:
    - cron: '0 7 * * *'
  
  # Déclenchement manuel avec options depuis l'onglet Actions sur GitHub
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de notification'
        required: true
        default: 'email'
        type: choice
        options:
          - email
          - telegram
          - both
      dry_run:
        description: 'Exécuter en mode simulation (sans envoi ni modification)'
        required: false
        default: false
        type: boolean

# Évite les conflits de push si une exécution manuelle chevauche le cron
concurrency:
  group: real-estate-scraper
  cancel-in-progress: false

permissions:
  contents: write # Nécessaire pour permettre le commit et push automatique de seen_announcements.json

jobs:
  scrape-and-notify:
    name: Scraping et Notification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Historique complet pour git pull/rebase

      - name: 🐍 Configuration de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Exécution de la veille immobilière
        env:
          # Configuration E-mail / SMTP
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          
          # Configuration Telegram (optionnel)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # Paramètres de recherche
          SEARCH_URLS: ${{ secrets.SEARCH_URLS }}
          REQUEST_TIMEOUT: 25
          LOG_LEVEL: INFO
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          
          CHANNEL="${{ inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            CHANNEL="email"
          fi
          
          python src/main.py --channel "$CHANNEL" $ARGS

      - name: 💾 Sauvegarde et synchronisation de l'état (seen_announcements.json)
        run: |
          # Vérifier si le fichier d'état a été modifié
          if [ -n "$(git status --porcelain data/seen_announcements.json)" ]; then
            echo "Nouvelles annonces détectées, commit et synchronisation..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin main || git pull --rebase
            git add data/seen_announcements.json
            git commit -m "chore(data): mise à jour des annonces vues [skip ci]"
            git push
            echo "État persisté avec succès dans le dépôt GitHub."
          else
            echo "Aucune modification de l'état, aucun commit nécessaire."
          fi
